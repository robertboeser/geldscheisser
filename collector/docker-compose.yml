# Collection stack. Runs on a VPS with a reliable, low-latency connection —
# an order book gap is unrecoverable, which makes home internet a poor place
# for this specific service. Keeps a rolling GS_RETENTION_DAYS window (default
# 90, enough for live features); the ../archive/ module (on the Pi) pulls
# from here periodically and keeps everything, unbounded. The execution
# service (phase 2/3) later runs on this same VPS, reading this same DB.
#
# Network isolation: every service shares the `tailscale` container's network
# namespace (network_mode: "service:tailscale") instead of publishing any
# port on the host — see TAILSCALE.md for the full design. The only thing
# ever reachable from outside this host at all is SSH.
#
# From this directory:
#   cp .env.example .env               # set GS_DISCORD_WEBHOOK_URL and TS_AUTHKEY
#   docker compose up -d --build
#   docker compose run --rm backfill
#   docker compose exec tailscale tailscale serve --bg --tcp=5432 tcp://localhost:5432   # once

x-collector: &collector
  build:
    context: ..
    dockerfile: collector/Dockerfile
  restart: unless-stopped
  network_mode: "service:tailscale"
  env_file:
    - path: ./.env
      required: false
  environment:
    GS_DATABASE_URL: postgresql://gs:gs@localhost:5432/geldscheisser
  depends_on:
    tailscale:
      condition: service_started
    timescaledb:
      condition: service_healthy

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: gs-collector
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env — see TAILSCALE.md}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"   # kernel networking — needed for `tailscale serve --tcp`
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
    environment:
      POSTGRES_USER: gs
      POSTGRES_PASSWORD: gs
      POSTGRES_DB: geldscheisser
    # No `ports:` section — nothing published to the host. Reachable at
    # gs-collector:5432 over the tailnet once `tailscale serve` (above) is
    # run, and from any other container here via localhost:5432.
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gs -d geldscheisser"]
      interval: 5s
      timeout: 3s
      retries: 20

  klines:
    <<: *collector
    command: klines

  orderbook:
    <<: *collector
    command: orderbook

  aggtrades:
    <<: *collector
    command: aggtrades

  futures:
    <<: *collector
    command: futures

  monitor:
    <<: *collector
    command: monitor

  backfill:
    <<: *collector
    command: backfill
    restart: "no"
    profiles: [backfill]

volumes:
  tsdata:
  tailscale-state:
