# Collection stack. Runs on a VPS with a reliable, low-latency connection —
# an order book gap is unrecoverable, which makes home internet a poor place
# for this specific service. Keeps a rolling GS_RETENTION_DAYS window (default
# 90, enough for live features); the ../archive/ module (on the Pi) pulls
# from here periodically and keeps everything, unbounded. The execution
# service (phase 2/3) later runs on this same VPS, reading this same DB.
#
# From this directory:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose run --rm backfill

x-collector: &collector
  build:
    context: ..
    dockerfile: collector/Dockerfile
  restart: unless-stopped
  env_file:
    - path: ./.env
      required: false
  environment:
    GS_DATABASE_URL: postgresql://gs:gs@timescaledb:5432/geldscheisser
  depends_on:
    timescaledb:
      condition: service_healthy

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gs
      POSTGRES_PASSWORD: gs
      POSTGRES_DB: geldscheisser
    ports:
      # Reachable so the archive (on the Pi) can pull from it — put both on
      # Tailscale/WireGuard rather than exposing this publicly.
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gs -d geldscheisser"]
      interval: 5s
      timeout: 3s
      retries: 20

  klines:
    <<: *collector
    command: klines

  orderbook:
    <<: *collector
    command: orderbook

  aggtrades:
    <<: *collector
    command: aggtrades

  futures:
    <<: *collector
    command: futures

  monitor:
    <<: *collector
    command: monitor

  backfill:
    <<: *collector
    command: backfill
    restart: "no"
    profiles: [backfill]

volumes:
  tsdata:
