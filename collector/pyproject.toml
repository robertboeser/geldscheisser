[project]
name = "gs-collector"
version = "0.1.0"
description = "Geldscheißer data collectors — 24/7 on the Pi (full archive) and on the VPS (short retention for live features)"
requires-python = ">=3.11"
dependencies = [
    "gs-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
gs = "gs_collector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
