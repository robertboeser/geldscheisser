# Phase 2/3 (runs on the VPS). Inference, signal engine, notifier, and later
# the order executor + risk manager. Depends on gs-collector because the VPS
# runs its own live collectors to compute features without relying on the Pi.
[project]
name = "gs-execution"
version = "0.1.0"
description = "Geldscheißer live layer: inference, signals, notifications, trading"
requires-python = ">=3.11"
dependencies = [
    "gs-common",
    "gs-collector",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_execution"]
