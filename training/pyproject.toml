# Phase 1 (runs on the Mac). Research deps (polars, lightgbm, mlflow, ...) land
# here once feature/label/backtest work starts.
[project]
name = "gs-training"
version = "0.1.0"
description = "Geldscheißer research: features, labeling, model training, backtesting"
requires-python = ">=3.11"
dependencies = [
    "gs-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_training"]
