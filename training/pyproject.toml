# Phase 1 (runs on the Mac). Model deps (lightgbm, mlflow) land here once the
# modelling work starts; the evaluation harness needs only arrays and parquet.
[project]
name = "gs-training"
version = "0.1.0"
description = "Geldscheißer research: features, labeling, model training, backtesting"
requires-python = ">=3.11"
dependencies = [
    "gs-common",
    "numpy>=2",
    "polars>=1",
    "pyarrow>=17",
    "lightgbm>=4",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gs-datasets = "gs_training.datasets:main"
gs-train = "gs_training.train:main"
gs-compare-sides = "gs_training.compare_sides:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
