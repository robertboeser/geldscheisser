[project]
name = "gs-common"
version = "0.1.0"
description = "Geldscheißer shared library: config, DB schema, Binance clients, alerting"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gs_common"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
